name: price-check

on:
  schedule:
    - cron: "*/5 * * * *"   # 每 5 分鐘執行
  workflow_dispatch:        # 可手動觸發

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "latest"

      - run: pip install requests

      - run: python check.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
